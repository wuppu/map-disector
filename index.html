                        ${lane.connections.length === 0 ? '<span style="color:var(--text-faint); font-size:11px;">No connections</span>' : ''}
                    </div>

                    <div class="section-title">Nodes Data</div>
                    ${nodesHtml}

                </div>
            `;
            el.addEventListener('click', (e) => {
                if (!e.target.closest('.edit-form') && !e.target.closest('.card-header')) {
                    selectLane(lane.id);
                }
            });
            container.appendChild(el);
        });
    }

    function selectLane(id) {
        state.editingId = (state.editingId === id) ? null : id;
        const lane = state.uiLanes.find(l => l.id === id);
        if (lane && state.editingId === id) {
            openSidebar();
            map.fitBounds(L.polyline(lane.points).getBounds(), { padding: [50, 50], maxZoom: 20 });
        }
        scheduleRefresh(['visuals', 'sidebar']);
    }

    function toggleMoveMode(id, checked) {
        if(checked) {
            if(!state.movingLaneIds.includes(id)) state.movingLaneIds.push(id);
        } else {
            state.movingLaneIds = state.movingLaneIds.filter(x => x !== id);
        }
        scheduleRefresh(['sidebar']);
    }

    async function updateLaneId(oldId, newIdStr) {
        const newId = parseInt(newIdStr);
        if (state.uiLanes.find(l => l.id === newId)) {
            await customAlert("ID duplicate");
            scheduleRefresh(['sidebar']);
            return;
        }
        const lane = state.uiLanes.find(l => l.id === oldId);
        if (lane) {
            lane.id = newId;
            if (state.editingId === oldId) state.editingId = newId;
            sortLanes();
            scheduleRefresh(['json', 'visuals', 'sidebar']);
        }
    }

    function updateProp(id, key, val) {
        const lane = state.uiLanes.find(l => l.id === id);
        if (!lane) return;
        lane[key] = val;
        // direction 변경만 지도 시각 업데이트 필요, 나머지는 JSON+sidebar만
        const needsVisuals = (key === 'direction');
        scheduleRefresh(needsVisuals ? ['json', 'visuals', 'sidebar'] : ['json', 'sidebar']);
    }

    function updateManeuver(id, idx, checked) {
        const lane = state.uiLanes.find(l => l.id === id);
        if (lane) { lane.maneuvers[idx] = checked; scheduleRefresh(['json']); }
    }

    function addConnection(id) {
        const lane = state.uiLanes.find(l => l.id === id);
        if (lane) {
            lane.connections.push({ lane: 0, signal: 0, maneuver: '8000' });
            scheduleRefresh(['json', 'visuals', 'sidebar']);
        }
    }

    function removeConnection(id, idx) {
        const lane = state.uiLanes.find(l => l.id === id);
        if (lane) { lane.connections.splice(idx, 1); scheduleRefresh(['json', 'visuals', 'sidebar']); }
    }

    function updateConnection(id, idx, key, val) {
        const lane = state.uiLanes.find(l => l.id === id);
        if (lane && lane.connections[idx]) {
            lane.connections[idx][key] = val;
            if (key === 'lane' && !state.uiLanes.find(l => l.id === val)) {
                console.warn(`Connection target lane ${val} does not exist`);
            }
            scheduleRefresh(['json', 'visuals']);
        }
    }

    async function deleteLane(id, e) {
        e.stopPropagation();
        if(await customConfirm("Delete this lane?")) {
            state.uiLanes = state.uiLanes.filter(l => l.id !== id);
            if(state.editingId === id) state.editingId = null;
            scheduleRefresh(['json', 'visuals', 'sidebar']);
        }
    }

    async function normalizeAndSave() {
        try {
            if (!state.originalJsonList.length || !state.uiLanes || state.uiLanes.length === 0) {
                await customAlert("JSON 데이터가 없거나 렌더링된 차로가 없습니다.\n우측 하단의 Render 버튼을 먼저 눌러주세요.");
                return;
            }

            const changeLog = {
                timestamp: new Date().toISOString(),
                intersectionName: state.intersectionInfo.name || "Unknown",
                summary: { totalLanes: state.uiLanes.length, lanesModified: 0 },
                details: [] // 여기에 쌓이는 로그들은 마지막에 정렬될 예정입니다.
            };

            // [Step 1] 방향 정렬 및 노드 최적화
            state.uiLanes.forEach(lane => {
                if (!lane.points || !Array.isArray(lane.points) || lane.points.length === 0) return;

                const laneLog = { laneId: lane.id, changes: [] };
                const originalPointsCount = lane.points.length;
                const ptCount = lane.points.length;

                // 1. 방향 변경 체크 (바뀌었을 때만 로그)
                if (ptCount > 1 && lane.points[0] && lane.points[ptCount - 1] && state.refPoint) {
                    const distFirst = Math.hypot(lane.points[0].lat - state.refPoint.lat, lane.points[0].lng - state.refPoint.lng);
                    const distLast = Math.hypot(lane.points[ptCount - 1].lat - state.refPoint.lat, lane.points[ptCount - 1].lng - state.refPoint.lng);

                    if (distLast < distFirst) {
                        lane.points.reverse();
                        laneLog.changes.push({ type: "DIRECTION_REVERSED", detail: "Lane points reversed to flow outward." });
                    }
                }

                // 2. 노드 최적화 및 보간
                if (lane.points.length > 2) {
                    lane.points = douglasPeuckerMeters(lane.points, CONFIG.dpEpsilonMeters, state.refPoint.lat) || lane.points;
                }
                lane.points = enforceMaxNodeDistance(lane.points, CONFIG.maxNodeDistMeters, state.refPoint) || lane.points;

                // 노드 개수가 실제로 달라졌을 때만 로그
                if (lane.points.length !== originalPointsCount) {
                    laneLog.changes.push({
                        type: "NODE_INTERPOLATION",
                        detail: `Node count changed from ${originalPointsCount} to ${lane.points.length} (XY6 Limit Enforced).`
                    });
                }

                // 변경사항이 하나라도 있으면 임시 저장
                if (laneLog.changes.length > 0) {
                    changeLog.details.push(laneLog);
                }
            });

            // [Step 2] Maneuver 및 후처리
            state.uiLanes.forEach(lane => {
                if (lane.direction === '40') {
                    const emptyManeuvers = new Array(12).fill(false);
                    // 이미 빈 배열이면 무시, 쓰레기값이 들어있을 때만 비우고 로그 기록
                    if (JSON.stringify(lane.maneuvers) !== JSON.stringify(emptyManeuvers)) {
                        lane.maneuvers = emptyManeuvers;

                        let existingLaneLog = changeLog.details.find(d => d.laneId === lane.id);
                        const logMsg = { type: "MANEUVER_CLEARED", detail: "Maneuvers cleared for Egress lane." };
                        if (existingLaneLog) existingLaneLog.changes.push(logMsg);
                        else changeLog.details.push({ laneId: lane.id, changes: [logMsg] });
                    }

                } else if (lane.connections && lane.connections.length > 0) {
                    let combinedVal = 0;
                    lane.connections.forEach(conn => {
                        if (conn.maneuver) {
                            combinedVal |= parseInt(String(conn.maneuver), 16) || 0;
                        }
                    });

                    // connection maneuver는 16비트(0x8000=straight, 0x4000=left, 0x2000=right)
                    // lane maneuver는 12비트(bit0=straight, bit1=left, bit2=right)
                    // 상위 12비트를 사용해야 정확히 매핑됨
                    let hexStr = combinedVal.toString(16).padStart(4, '0');
                    let newManeuvers = hexToBitArray(hexStr, 16).slice(0, 12);

                    // 계산된 값과 기존 값이 다를 경우에만 덮어쓰고 로그 기록
                    if (JSON.stringify(lane.maneuvers) !== JSON.stringify(newManeuvers)) {
                        lane.maneuvers = newManeuvers;

                        let existingLaneLog = changeLog.details.find(d => d.laneId === lane.id);
                        const logMsg = {
                            type: "MANEUVER_UPDATED",
                            detail: `Maneuvers synchronized with connections (Combined Hex: ${hexStr}).`
                        };

                        if (existingLaneLog) existingLaneLog.changes.push(logMsg);
                        else changeLog.details.push({ laneId: lane.id, changes: [logMsg] });
                    }
                }
            });

            // [Step 3] 로그 데이터 정렬 (laneId 오름차순) 및 마무리
            changeLog.details.sort((a, b) => a.laneId - b.laneId);
            changeLog.summary.lanesModified = changeLog.details.length;

            updateJson();
            refreshVisuals();
            renderSidebar();

            // [Step 4] 결과 안내 팝업
            if (changeLog.details.length > 0) {
                const wantsDownload = await customConfirm(`Normalize 완료.\n${changeLog.details.length}개의 차로에서 수정 사항이 발견되었습니다.\n\n수정 내역(JSON)을 다운로드하시겠습니까?`);
                if (wantsDownload) {
                    if (typeof downloadNormalizationLog === 'function') {
                        downloadNormalizationLog(changeLog);
                    } else {
                        await customAlert("다운로드 함수가 누락되었습니다.");
                    }
                }
            } else {
                // 수정된 사항이 단 하나도 없다면
                await customAlert("Normalization 완료.\n모든 데이터가 정상이며 수정할 사항이 없습니다.");
            }

        } catch (error) {
            console.error("Normalize Error:", error);
            await customAlert(`Normalize 중 오류가 발생했습니다:\n\n${error.message}\n\n(콘솔에서 상세 스택을 확인하세요)`);
        }
    }

    function downloadNormalizationLog(logData) {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(logData, null, 2));
        const name = (state.intersectionInfo.name || state.intersectionInfo.id || 'export')
            .toString().replace(/[\\/:*?"<>|]/g, '_');
        const date = new Date().toISOString().slice(0, 10); // YYYY-MM-DD
        const downloadAnchorNode = document.createElement('a');
        downloadAnchorNode.setAttribute("href", dataStr);
        downloadAnchorNode.setAttribute("download", `normalization_log_${name}_${date}.json`);
        document.body.appendChild(downloadAnchorNode);
        downloadAnchorNode.click();
        downloadAnchorNode.remove();
    }

    function updateJson() {
        if (!state.originalJsonList.length) return;
        try {
        const entry = state.containerArr[state.selectedContainerIndex];
        if (!entry) return;
        // containerObj는 originalJsonList 내의 객체를 직접 참조하므로 in-place 수정됨
        let containerObj = entry.ref;

        // DescriptiveName 최소 1자 제약: 빈 문자열이면 필드 제거
        if (state.intersectionInfo.name) containerObj.name = state.intersectionInfo.name;
        else delete containerObj.name;
        if (!containerObj.id) containerObj.id = {};
        if (state.intersectionInfo.region) containerObj.id.region = state.intersectionInfo.region;
        containerObj.id.id = state.intersectionInfo.id;

        containerObj.refPoint.lat = Math.round(state.refPoint.lat * 10000000);
        containerObj.refPoint.long = Math.round(state.refPoint.lng * 10000000);

        let targetLaneSetKey = state.layerType === "generalMapData" ? "roadLaneSet" : "laneSet";
        if (!containerObj[targetLaneSetKey]) containerObj[targetLaneSetKey] = [];

        let targetLaneSet = containerObj[targetLaneSetKey];
        targetLaneSet = targetLaneSet.filter(jl => state.uiLanes.some(ul => ul.id === jl.laneID));

        sortLanes();

        state.uiLanes.forEach(ui => {
            let jsonIndex = targetLaneSet.findIndex(jl => jl.laneID === ui.id);
            const orderedLane = {};

            orderedLane.laneID = ui.id;
            if(ui.name) orderedLane.name = ui.name;

            if (ui.direction === "80" && ui.approachID > 0) orderedLane.ingressApproach = ui.approachID;
            else if (ui.direction === "40" && ui.approachID > 0) orderedLane.egressApproach = ui.approachID;

            let attrVal = {};
            try { attrVal = JSON.parse(ui.typeAttr); } catch(e) { attrVal = ui.typeAttr; }
            const lTypeObj = {};
            lTypeObj[ui.type] = attrVal;

            orderedLane.laneAttributes = {
                directionalUse: ui.direction,
                sharedWith: ui.sharedWith,
                laneType: lTypeObj
            };

            if (ui.direction !== '40') {
                orderedLane.maneuvers = bitArrayToHex(ui.maneuvers);
            }

            const nodeList = [];
            let prevLat = state.refPoint.lat, prevLng = state.refPoint.lng;
            const cosLatJson = Math.cos(state.refPoint.lat * Math.PI / 180);

            ui.points.forEach((pt, idx) => {
                const dLat = pt.lat - prevLat, dLng = pt.lng - prevLng;
                const y_cm = Math.round(dLat * CONFIG.cmPerDegLat);
                const x_cm = Math.round(dLng * (CONFIG.cmPerDegLat * cosLatJson));

                let type = "node-XY6";
                const max = Math.max(Math.abs(x_cm), Math.abs(y_cm));
                if(max<=511) type="node-XY1";
                else if(max<=1023) type="node-XY2";
                else if(max<=2047) type="node-XY3";
                else if(max<=4095) type="node-XY4";
                else if(max<=8191) type="node-XY5";

                const node = { delta: { [type]: { x: x_cm, y: y_cm } } };

                if (ui.direction === "80" && idx === 0) {
                    node.attributes = { localNode: ["stopLine"] };
                }

                nodeList.push(node);
                prevLat = pt.lat; prevLng = pt.lng;
            });
            orderedLane.nodeList = { nodes: nodeList };

            const connectsTo = ui.connections.map(c => ({
                connectingLane: { lane: c.lane, maneuver: c.maneuver || "0000" },
                signalGroup: c.signal
            }));

            if (connectsTo.length > 0) orderedLane.connectsTo = connectsTo;

            if (jsonIndex >= 0) targetLaneSet[jsonIndex] = orderedLane;
            else targetLaneSet.push(orderedLane);
        });

        targetLaneSet.sort((a,b) => a.laneID - b.laneID);
        containerObj[targetLaneSetKey] = targetLaneSet;

        // 원본 JSON 전체를 textarea에 반영 (여러 JSON이면 줄바꿈으로 구분)
        document.getElementById('jsonInput').value =
            state.originalJsonList.map(j => JSON.stringify(j, null, 2)).join('\n\n');
        } catch (e) {
            console.error("updateJson 오류:", e);
        }
    }

    function hexToBitArray(hex, length) {
        if (!hex) return new Array(length).fill(false);
        const val = parseInt(hex, 16);
        if (isNaN(val)) return new Array(length).fill(false);
        // hex 자릿수(4자리=16비트)만큼 앞을 0으로 채운 뒤 length 비트를 읽음
        // padStart(length)만 쓰면 "4000"→15비트 이진수에서 선행 0이 빠져 항상 bit[0]=1이 되는 버그 발생
        const fullBits = Math.max(hex.length * 4, length);
        const binStr = val.toString(2).padStart(fullBits, '0');
        const bits = [];
        for (let i = 0; i < length; i++) bits.push(binStr[i] === '1');
        return bits;
    }

    function bitArrayToHex(bits) {
        const str = bits.map(b => b ? '1' : '0').join('');
        const padded = str.padEnd(16, '0');  // 16비트로 확장 → 항상 4자리 hex
        let hex = "";
        for (let i = 0; i < padded.length; i += 4) {
            hex += parseInt(padded.substr(i, 4), 2).toString(16).toUpperCase();
        }
        return hex;
    }

    function getIntersectionPoint(A, B, C, D) {
        if (A.lat === B.lat && A.lng === B.lng) return {lat: (B.lat + C.lat)/2, lng: (B.lng + C.lng)/2};
        if (C.lat === D.lat && C.lng === D.lng) return {lat: (B.lat + C.lat)/2, lng: (B.lng + C.lng)/2};

        const a1 = B.lat - A.lat;
        const b1 = A.lng - B.lng;
        const c1 = a1 * A.lng + b1 * A.lat;

        const a2 = D.lat - C.lat;
        const b2 = C.lng - D.lng;
        const c2 = a2 * C.lng + b2 * C.lat;

        const det = a1 * b2 - a2 * b1;
        if (Math.abs(det) < 1e-10) {
            return { lat: (B.lat + C.lat) / 2, lng: (B.lng + C.lng) / 2 };
        }
        const x = (b2 * c1 - b1 * c2) / det;
        const y = (a1 * c2 - a2 * c1) / det;

        const distBC = Math.hypot(B.lat - C.lat, B.lng - C.lng);
        const distB = Math.hypot(B.lat - y, B.lng - x);
        const distC = Math.hypot(C.lat - y, C.lng - x);

        const dotB = (x - B.lng)*(B.lng - A.lng) + (y - B.lat)*(B.lat - A.lat);
        const dotC = (C.lng - x)*(D.lng - C.lng) + (C.lat - y)*(D.lat - C.lat);

        if (distB > distBC * 2 || distC > distBC * 2 || dotB < 0 || dotC < 0) {
            return { lat: (B.lat + C.lat) / 2, lng: (B.lng + C.lng) / 2 };
        }

        return { lat: y, lng: x };
    }

    function generateBezier(p0, p1, p2, steps = 20) {
        const pts = [];
        for (let i = 0; i <= steps; i++) {
            const t = i / steps;
            const u = 1 - t;
            const lat = u*u*p0.lat + 2*u*t*p1.lat + t*t*p2.lat;
            const lng = u*u*p0.lng + 2*u*t*p1.lng + t*t*p2.lng;
            pts.push({lat, lng});
        }
        return pts;
    }

    function drawOverview() {
        groups.overview.clearLayers();
        if (!state.showAll || state.containerArr.length <= 1) return;

        state.containerArr.forEach((entry, idx) => {
            if (idx === state.selectedContainerIndex) return; // 현재 선택된 건 제외

            const refPoint = {
                lat: entry.ref.refPoint.lat / 10000000,
                lng: entry.ref.refPoint.long / 10000000
            };
            const laneSetKey = entry.layerType === "generalMapData" ? "roadLaneSet" : "laneSet";
            const laneSet = entry.ref[laneSetKey] || [];

            // refPoint 마커
            L.circleMarker([refPoint.lat, refPoint.lng], {
                radius: 6, color: '#94a3b8', fillColor: '#475569', fillOpacity: 0.8, weight: 1
            }).addTo(groups.overview)
              .bindTooltip(entry.ref.name || `Map ${idx + 1}`, { permanent: false });

            laneSet.forEach(l => {
                if (!l.nodeList?.nodes) return;
                const points = calculatePoints(l.nodeList.nodes, refPoint);
                if (!points.length) return;

                const dir = l.laneAttributes?.directionalUse || "00";
                const color = dir === "80" ? "#3b82f6" : dir === "40" ? "#ef4444" : "#94a3b8";

                L.polyline(points, { color: '#1e293b', weight: 6, opacity: 0.5 }).addTo(groups.overview);
                L.polyline(points, { color, weight: 2.5, opacity: 0.55 })
                    .addTo(groups.overview)
                    .on('click', () => {
                        loadContainerByIndex(idx);
                        scheduleRefresh();
                    });
            });
        });
    }

    function toggleShowAll() {
        state.showAll = !state.showAll;
        drawOverview();
        const btn = document.getElementById('btnShowAll');
        if (btn) {
            btn.style.background = state.showAll ? 'rgba(79,142,247,0.3)' : '';
            btn.style.color = state.showAll ? '#4f8ef7' : '';
            btn.title = state.showAll ? '현재 교차로만 표시' : '모든 교차로 표시';
        }
    }

    function refreshVisuals() {
        groups.casing.clearLayers();
        groups.lanes.clearLayers();
        groups.connections.clearLayers();
        groups.labels.clearLayers();
        groups.nodes.clearLayers();

        // MAP 이름: 오른쪽 상단 고정 div 업데이트
        const nameEl = document.getElementById('map-name-display');
        if (nameEl) {
            const mapName = state.intersectionInfo.name;
            nameEl.textContent = mapName || '';
            nameEl.classList.toggle('visible', !!mapName);
        }

        if(state.refPoint) {
            L.circleMarker([state.refPoint.lat, state.refPoint.lng], { radius: 8, color: '#fff', fillColor: '#fbbf24', fillOpacity: 1 }).addTo(groups.lanes).bindTooltip("REF");

        }

        // 존재하는 모든 신호그룹 ID → 절대 겹치지 않는 색 배정 (패널과 공통)
        const sgColorMap = computeSgColorMap();

        // SG 라벨: 신호그룹별로 "시작 지점"들을 모아 한 번만 그림 (겹치면 위치 이동)
        const sgAnchors = new Map(); // signal → { lats:[], lngs:[], color }

        state.uiLanes.forEach(lane => {
            if (lane.points.length === 0) return;

            const isSelected = (lane.id === state.editingId);
            const casingColor = isSelected ? '#fbbf24' : '#000';
            const casingWeight = isSelected ? 14 : 8;
            const casingOpacity = isSelected ? 0.8 : 0.6;

            let color = '#10b981';
            if (lane.direction === '80') color = '#3b82f6';
            else if (lane.direction === '40') color = '#ef4444';

            const casing = L.polyline(lane.points, { color: casingColor, weight: casingWeight, opacity: casingOpacity }).addTo(groups.casing);
            const core = L.polyline(lane.points, { color: color, weight: 4 }).addTo(groups.lanes);

            if (isSelected) {
                casing.bringToFront();
                core.bringToFront();
            }

            let labelPt;
            const ptCount = lane.points.length;

            if (ptCount === 1) {
                labelPt = lane.points[0];
            } else {
                labelPt = {
                    lat: (lane.points[0].lat + lane.points[1].lat) / 2,
                    lng: (lane.points[0].lng + lane.points[1].lng) / 2
                };
            }

            const labelIcon = L.divIcon({
                className: 'lane-label',
                html: `<div class="lane-label-container">${lane.id}</div>`,
                iconSize: [22, 22],
                iconAnchor: [11, 11]
            });
            L.marker(labelPt, { icon: labelIcon, interactive: false }).addTo(groups.labels);

            lane.connections.forEach(conn => {
                const destLane = state.uiLanes.find(l => l.id === conn.lane);
                if (!destLane || destLane.points.length === 0) return;

                const B = lane.points[0];
                const A = lane.points.length > 1 ? lane.points[1] : B;

                const C = destLane.points[0];
                const D = destLane.points.length > 1 ? destLane.points[1] : C;

                const P1 = getIntersectionPoint(A, B, C, D);
                const bezierPts = generateBezier(B, P1, C, 20);

                const sgColor = sgColorMap.get(conn.signal) || '#a8a29e';

                // 흰 케이싱 (하단) → 컬러 선 (상단): 겹쳐도 각 SG가 명확히 구분됨
                L.polyline(bezierPts, {
                    color: '#ffffff',
                    weight: 6,
                    opacity: 0.5,
                    dashArray: '8, 8'
                }).addTo(groups.connections);
                L.polyline(bezierPts, {
                    color: sgColor,
                    weight: 4,
                    opacity: 0.95,
                    dashArray: '8, 8'
                }).addTo(groups.connections);

                // SG 라벨 위치: 곡선의 "시작 부분"(진입 정지선 근처)에 가깝게 잡음
                const startIdx = Math.min(bezierPts.length - 1, Math.round(bezierPts.length * 0.18));
                const startPt = bezierPts[startIdx];
                if (!sgAnchors.has(conn.signal)) {
                    sgAnchors.set(conn.signal, { lats: [], lngs: [], color: sgColor });
                }
                const entry = sgAnchors.get(conn.signal);
                entry.lats.push(startPt.lat);
                entry.lngs.push(startPt.lng);
            });

            lane._casing = casing;
            lane._core = core;
            lane._markers = [];

            [casing, core].forEach(l => {
                l.on('click', (e) => {
                    L.DomEvent.stopPropagation(e);
                    selectLane(lane.id);
                    setTimeout(() => {
                        const card = document.getElementById(`card-${lane.id}`);
                        if(card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }, 100);
                });
            });

            lane.points.forEach((pt, idx) => {
                let mkIcon;

                if (lane.direction === '00' || ptCount === 1) {
                    mkIcon = L.divIcon({ className: 'node-handle', iconSize: [10, 10] });
                } else {
                    let angle = 0;
                    let pStart, pEnd;

                    if (lane.direction === '80') {
                        if (idx > 0) {
                            pStart = lane.points[idx];
                            pEnd = lane.points[idx - 1];
                        } else {
                            pStart = lane.points[1];
                            pEnd = lane.points[0];
                        }
                    } else if (lane.direction === '40') {
                        if (idx < ptCount - 1) {
                            pStart = lane.points[idx];
                            pEnd = lane.points[idx + 1];
                        } else {
                            pStart = lane.points[idx - 1];
                            pEnd = lane.points[idx];
                        }
                    }

                    if (pStart && pEnd) {
                        const pStartLayer = map.latLngToLayerPoint(pStart);
                        const pEndLayer = map.latLngToLayerPoint(pEnd);
                        const dy = pEndLayer.y - pStartLayer.y;
                        const dx = pEndLayer.x - pStartLayer.x;
                        angle = Math.atan2(dy, dx) * 180 / Math.PI;
                    }

                    const rotation = angle + 90;
                    const arrowColor = isSelected ? '#f59e0b' : '#ffffff';

                    mkIcon = L.divIcon({
                        className: 'node-arrow-wrapper',
                        html: `
                            <div class="node-arrow-rotator" style="transform: rotate(${rotation}deg);">
                                <div class="node-arrow" style="border-bottom-color: ${arrowColor};"></div>
                            </div>
                        `,
                        iconSize: [20, 20],
                        iconAnchor: [10, 10]
                    });
                }

                const mk = L.marker(pt, { icon: mkIcon, draggable: true }).addTo(groups.nodes);
                lane._markers.push(mk);
                if (isSelected) mk.setZIndexOffset(1000);

                let startDragPos = null;
                let _dragRaf = null;

                mk.on('dragstart', (e) => {
                    startDragPos = e.target.getLatLng();
                });

                mk.on('drag', e => {
                    const newPos = e.target.getLatLng();

                    if (state.movingLaneIds.includes(lane.id)) {
                        const latDiff = newPos.lat - startDragPos.lat;
                        const lngDiff = newPos.lng - startDragPos.lng;
                        lane.points.forEach((p, i) => {
                            p.lat += latDiff;
                            p.lng += lngDiff;
                        });
                        startDragPos = newPos;
                    } else {
                        lane.points[idx] = newPos;
                    }

                    // RAF로 쓰로틀: 같은 프레임 내 중복 setLatLngs 방지
                    if (_dragRaf) return;
                    _dragRaf = requestAnimationFrame(() => {
                        _dragRaf = null;
                        lane._casing.setLatLngs(lane.points);
                        lane._core.setLatLngs(lane.points);
                        if (state.movingLaneIds.includes(lane.id)) {
                            lane.points.forEach((p, i) => {
                                if (i !== idx && lane._markers[i]) lane._markers[i].setLatLng(p);
                            });
                        }
                    });
                });

                mk.on('dragend', () => {
                    // 드래그 후 JSON·지도만 갱신, 사이드바는 편집 중인 레인일 때만
                    scheduleRefresh(['json', 'visuals']);
                    if (state.editingId === lane.id) scheduleRefresh(['sidebar']);
                });
            });
        });

        // 신호그룹 라벨: 시작 지점 근처에 표시 (픽셀 좌표 충돌 회피)
        drawSignalGroupLabels(sgAnchors);
    }

    // SG 라벨을 화면 픽셀 좌표에서 서로 겹치지 않게 배치
    function drawSignalGroupLabels(sgAnchors) {
        const GAP_X = 58;   // 라벨 최소 수평 간격 (px)
        const GAP_Y = 26;   // 라벨 최소 수직 간격 (px)

        // 신호별 앵커: 첫 연결의 시작 지점(실제 정지선 근처)을 사용
        // 평균을 쓰면 한 신호가 여러 연결에 걸릴 때 중점으로 밀려 보이므로 평균 금지
        const items = [];
        sgAnchors.forEach((entry, signal) => {
            const anchor = map.latLngToLayerPoint([entry.lats[0], entry.lngs[0]]);
            items.push({ signal, color: entry.color, anchor });
        });

        // 앵커 위치가 안정적으로 배치되도록 상→하, 좌→우 정렬
        items.sort((a, b) => (a.anchor.y - b.anchor.y) || (a.anchor.x - b.anchor.x));

        const placed = []; // 확정된 라벨 중심 픽셀 좌표
        const collides = (px, py) =>
            placed.some(p => Math.abs(p.x - px) < GAP_X && Math.abs(p.y - py) < GAP_Y);

        // 앵커에서 타원형 링을 넓혀가며 빈 자리를 반드시 찾음 (겹침 절대 방지)
        function findFreeSpot(anchor) {
            if (!collides(anchor.x, anchor.y)) return { x: anchor.x, y: anchor.y, off: { x: 0, y: 0 } };
            for (let r = 1; r <= 60; r++) {
                const samples = 8 + r * 2;
                for (let k = 0; k < samples; k++) {
                    const ang = (k / samples) * 2 * Math.PI;
                    const ox = Math.cos(ang) * r * (GAP_X * 0.55);
                    const oy = Math.sin(ang) * r * (GAP_Y * 0.95);
                    if (!collides(anchor.x + ox, anchor.y + oy)) {
                        return { x: anchor.x + ox, y: anchor.y + oy, off: { x: ox, y: oy } };
                    }
                }
            }
            return { x: anchor.x, y: anchor.y, off: { x: 0, y: 0 } };
        }

        items.forEach(item => {
            const pos = findFreeSpot(item.anchor);
            placed.push({ x: pos.x, y: pos.y });

            const labelLatLng = map.layerPointToLatLng([pos.x, pos.y]);

            // 앵커에서 이동했으면 얇은 리더선으로 연결
            if (Math.hypot(pos.off.x, pos.off.y) > 4) {
                const anchorLatLng = map.layerPointToLatLng([item.anchor.x, item.anchor.y]);
                L.polyline([anchorLatLng, labelLatLng], {
                    className: 'sg-leader',
                    color: item.color, weight: 1.5, opacity: 0.65
                }).addTo(groups.labels);
                L.circleMarker(anchorLatLng, {
                    radius: 2.5, color: item.color, fillColor: item.color,
                    fillOpacity: 1, weight: 0, interactive: false
                }).addTo(groups.labels);
            }

            const sgIcon = L.divIcon({
                className: 'sg-label',
                html: `<div class="sg-label-container" style="background:${item.color}ee;">SG:${item.signal}</div>`,
                iconSize: [50, 22],
                iconAnchor: [25, 11]
            });
            L.marker(labelLatLng, { icon: sgIcon, interactive: false }).addTo(groups.labels);
        });
    }

    function startDrawing() {
        if (state.isDrawing) return;
        state.isDrawing = true; state.tempPoints = [];
        document.getElementById('drawBanner').style.display = 'block';
        closeSidebar();
        document.getElementById('map').style.cursor = 'crosshair';
        map.on('contextmenu', finishDrawing);
    }

    function finishDrawing(e) {
        if (state.isDrawing) {
            L.DomEvent.stopPropagation(e); L.DomEvent.preventDefault(e);
            state.isDrawing = false;
            document.getElementById('drawBanner').style.display = 'none';
            openSidebar();
            document.getElementById('map').style.cursor = '';
            groups.temp.clearLayers();
            map.off('contextmenu', finishDrawing);

            if (state.tempPoints.length > 0) {
                const maxId = state.uiLanes.reduce((m, l) => Math.max(m, l.id || 0), 0);
                const newId = maxId + 1;
                state.uiLanes.push({
                    id: newId,
                    name: "New Lane",
                    points: [...state.tempPoints],
                    direction: "80",
                    approachID: 1,
                    type: 'vehicle',
                    typeAttr: '{"value":"", "length":0}',
                    sharedWith: '0000',
                    maneuvers: new Array(12).fill(false),
                    connections: [],
                    _casing: null, _core: null, _markers: []
                });

                sortLanes();
                updateJson();
                refreshVisuals();
                selectLane(newId);
            }
            state.tempPoints = [];
        }
    }

    map.on('click', e => {
        if (!state.isDrawing) return;
        state.tempPoints.push(e.latlng);
        L.circleMarker(e.latlng, { radius: 4, color: '#10b981', fillOpacity: 1 }).addTo(groups.temp);
        if(state.tempPoints.length > 1) L.polyline(state.tempPoints, { color: '#10b981', dashArray: '5,5' }).addTo(groups.temp);
    });

    setTimeout(() => { map.invalidateSize(); parseAndRender(); }, 500);
    
    function customAlert(message) {
        return new Promise(resolve => {
            const overlay = document.getElementById('customModal');
            document.getElementById('customModalText').innerText = message;
            document.getElementById('customModalBtnCancel').style.display = 'none';
            const btnOk = document.getElementById('customModalBtnOk');

            overlay.style.display = 'flex';

            btnOk.onclick = () => {
                overlay.style.display = 'none';
                resolve();
            };
        });
    }

    function customConfirm(message) {
        return new Promise(resolve => {
            const overlay = document.getElementById('customModal');
            document.getElementById('customModalText').innerText = message;
            const btnCancel = document.getElementById('customModalBtnCancel');
            const btnOk = document.getElementById('customModalBtnOk');

            btnCancel.style.display = 'block';
            overlay.style.display = 'flex';

            btnCancel.onclick = () => { overlay.style.display = 'none'; resolve(false); };
            btnOk.onclick = () => { overlay.style.display = 'none'; resolve(true); };
        });
    }

</script>
